[pytest]
# Configuración básica
pythonpath = .
testpaths = api/tests
python_files = test_*.py auth_*.py create_*.py
python_classes = Test
python_functions = test_*

# Marcadores personalizados
markers =
    smoke: pruebas básicas de funcionalidad
    integration: pruebas de integración
    api: pruebas de API
    ui: pruebas de interfaz de usuario
    slow: pruebas que tardan más tiempo

# Configuración de reportes
addopts =
    -v
    --html=reports/report_%(date)s.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --cov=api
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml
    --capture=tee-sys
    --tb=short
    --strict-markers
    --strict-config

# Configuración de logs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configuración de warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Variables de entorno para las pruebas
# Nota: Las variables de entorno se configuran en el workflow de GitHub Actions
# o usando pytest-env plugin si es necesario

    